<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de tabelas grandes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
        }

        .num {
            text-align: right;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgrey;
        }

        #populacao {
            width: 50px;
        }

        tbody > tr:nth-child(even) { /* 2n-1 */
            background-color: blue;
            text-decoration-line: underline;
        }

        tbody > tr:nth-child(odd) {  /* 2n */
            background-color: yellow;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
    ANATOMIA PARA TABELAS GRANDES
    TABLE
        CAPTION
        THEAD
            TR, TD, TH
        TBODY
            TR, TD, TH
        TFOOT
            TR, TD, TH
    -->
    <table>
        <caption>População dos Conselhos de Portugal</caption>
        <thead>
            <tr>
                <th scope="col">Conselho</th>
                <th scope="col" id="populacao">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Lisboa</td>
                <td class="num">546 923</td>
            </tr>
            <tr>
                <td>Sintra</td>
                <td class="num">388 001</td>
            </tr>
            <tr>
                <td>Vila Nova de Gaia</td>
                <td class="num">306 735</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td class="num"><strong>1 290 589</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
