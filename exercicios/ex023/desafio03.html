<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 05</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 350px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 4px;
            text-align: center;
        }

        .cabecalho {
            background-color: rgb(100, 100, 100);
            color: white;
            font-weight: bold;
        }

        .num_cabecalho {
            background-color: rgb(100, 100, 100);
            color: white;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" class="cabecalho" rowspan="2">Área</th>
                <th scope="col" class="cabecalho" rowspan="2">Disciplina</th>
                <th scope="colgroup" colspan="2" class="cabecalho">Notas</th>
                <th scope="col" class="cabecalho" rowspan="2">Média</th>
            </tr>
            <tr>
                <th scope="col" class="cabecalho">Nota 1</th>
                <th scope="col" class="cabecalho">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th class="cabecalho" colspan="4">Média de Exatas</th>
                <th class="num_cabecalho">0.0</th>
            </tr>
            <tr>
                <th rowspan="4">Humanas</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th class="cabecalho" colspan="4">Média de Humanas</th>
                <td class="num_cabecalho">0.0</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
