<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            text-align: center;
            border-collapse: collapse;
        }

        .linha {
            background-color: grey;
        }

        td {
            border: 1px solid black;
            padding: 8px;
        }

        .dado {
            background-color: yellow;
        }

        .xadrez-fundo {
            background-color: black;
            color:white
        }

        .xadrez-letra {
            color: black
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
    HIERARQUIA DE TABELAS (simples)
    TABLE = tabela
        TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela
    -->
    <table>
        <tr> <!-- Primeira linha--> 
            <td class="xadrez-fundo">A1</td>
            <td class="xadrez-letra">B1</td>
            <td class="xadrez-fundo">C1</td>
        </tr>
        <tr> <!-- Primeira linha--> 
            <td class="xadrez-letra">A2</td>
            <td class="xadrez-fundo">B2</td>
            <td class="xadrez-letra">C2</td>
        </tr>
        <tr> <!-- Primeira linha--> 
            <td class="xadrez-fundo">A3</td>
            <td class="xadrez-letra">B3</td>
            <td class="xadrez-fundo">C3</td>
        </tr>
        <tr> <!-- Primeira linha--> 
            <td class="xadrez-letra">A4</td>
            <td class="xadrez-fundo">B4</td>
            <td class="xadrez-letra">C4</td>
        </tr>
        <tr>
            <td class="xadrez-fundo">A5</td>
            <td class="xadrez-letra">B5</td>
        </tr>
        <tr>
            <td class="xadrez-letra">A6</td>
        </tr>
    </table>
</body>
</html>
