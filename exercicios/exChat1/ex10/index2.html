<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero de um site</title>
    <style>
        #hero {
            position: relative;
            width: 600px;
            height: 500px;
            border: 1px solid black;
            border-radius: 5px;
            padding: 10px;
            
        }

        button {
            position: absolute;
        }

        #comecar {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #notificacao {
            bottom: 15px;
            right: 15px;
        }
    </style>
</head>
<body>
    <div id="hero">
        <h1>TECNOLOGIA PARA O FUTURO</h1>
        <p>Aprende. Cria. Programa</p>
        <button id="comecar">Começar</button>
        <button id="notificacao">🔔</button>
    </div>
</body>
</html>
