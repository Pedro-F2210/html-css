<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Notas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            text-align: center;
        }

        td {
            border: 1px solid black;
            padding: 8px;
        }

        .xadrez-fundo {
            background-color: black;
            color: white;
        }

        .xadrez-letra {
            color: black;
        }

        .cabeçalho {
            font-weight: bold;
            background-color: aqua;
        }

        .nomes {
            font-weight: bold;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <h1>Notas da Turma</h1>
    <table>
        <tr>
            <td class="cabeçalho">Aluno</td>
            <td class="cabeçalho">Português</td>
            <td class="cabeçalho">Matemática</td>
            <td class="cabeçalho">Informática</td>
        </tr>
        <tr>
            <td class="nomes">Pedro</td>
            <td class="xadrez-fundo">16</td>
            <td class="xadrez-letra">18</td>
            <td class="xadrez-fundo">19</td>
        </tr>
        <tr>
            <td class="nomes">João</td>
            <td class="xadrez-letra">12</td>
            <td class="xadrez-fundo">15</td>
            <td class="xadrez-letra">14</td>
        </tr>
        <tr>
            <td class="nomes">Ana</td>
            <td class="xadrez-fundo">17</td>
            <td class="xadrez-letra">16</td>
            <td class="xadrez-fundo">18</td>
        </tr>
        <tr>
            <td class="nomes">Maria</td>
            <td class="xadrez-letra">14</td>
            <td class="xadrez-fundo">19</td>
            <td class="xadrez-letra">17</td>
        </tr>
        <tr>
            <td class="nomes">Rui</td>
            <td class="xadrez-fundo">11</td>
            <td class="xadrez-letra">13</td>
            <td class="xadrez-fundo">15</td>
        </tr>
    </table>
</body>
</html>
