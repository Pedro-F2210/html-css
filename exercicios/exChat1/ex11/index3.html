<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de contacto</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="3" maxlength="30" autocomplete="name">
            </p>
            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" required pattern="^9[1234]\d{7}$">
            </p>
        </fieldset>
        <fieldset>
            <legend>Mensagem</legend>
            <p>
                <label for="iassunto">Assunto</label>
                <input type="text" name="assunto" id="iassunto" minlength="5" maxlength="50" required>
            </p>
            <p>
                <label for="icod">Código postal</label>
                <input type="text" name="cod" id="icod" required pattern="^\d{4}-\d{3}$">
            </p>
        </fieldset>
        <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>
</body>
</html>
