<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Candidatura</title>
</head>
<body>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Dados do Candidato</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required maxlength="40" minlength="3" autocomplete="name">
            </p>
            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" required pattern="^9[1236]\d{7}$">
            </p>
        </fieldset>
        <fieldset>
            <legend>Dados do estágio</legend>
            <p>
                <label for="icod">Código postal</label>
                <input type="text" name="cod" id="icod" required pattern="^\d{4}-\d{3}$">
            </p>
            <p>
                <label for="iano">Ano de conclusão</label>
                <input type="number" name="ano" id="iano" min="2026" max="2035" required>
            </p>
            <p>
                <label for="imedia">Média escolar</label>
                <input type="number" name="media" id="imedia" min="0" max="20" step="0.1">
            </p>
        </fieldset>
        <fieldset>
            <legend>Data da candidatura</legend>
            <p>
                <label for="imes">Mês</label>
                <input type="month" name="mes" id="imes" required>
            </p>
            <p>
                <label for="idata">Data da entrevista</label>
                <input type="date" name="data" id="idata" required>
            </p>
            <p>
                <label for="ihora">Hora da entrevista</label>
                <input type="time" name="hora" id="ihora" required>
            </p>
        </fieldset>
        <p>
                <input type="submit" value="Enviar candidatura">
                <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
