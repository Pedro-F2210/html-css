<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Desempenho</title>
    <style>
        h1 {
            text-decoration: underline;
            margin-left: 3.5em;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        table {
            text-align: center;
            border-collapse: collapse;
            width: 600px;
            height: 400px;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            vertical-align: center;
        }

        .cabecalho {
            font-weight: bolder;
            background-color: rgb(192, 81, 81);
        }

        .nomes {
            font-weight: bold;
            background-color: rgb(114, 62, 62);
        }

        .xadrez-fundo {
            background-color: blue;
            color: yellow;
        }

        .xadrez-letra {
            background-color: yellow;
        }

        .media {
            text-decoration-line: underline;
            text-align: right;
        }

        .media-especial {
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <h1>Desempenho da Turma</h1>
    <table> 
        <tr>
            <td class="cabecalho">Aluno</td>
            <td class="cabecalho">Português</td>
            <td class="cabecalho">Matemática</td>
            <td class="cabecalho">Informática</td>
            <td class="cabecalho">Inglês</td>
            <td class="cabecalho">Média</td>
        </tr>
        <tr>
            <td class="nomes">Pedro</td>
            <td class="xadrez-fundo">17</td>
            <td class="xadrez-letra">19</td>
            <td class="xadrez-fundo">20</td>
            <td class="xadrez-letra">16</td>
            <td class="media">18</td>
        </tr>
        <tr>
            <td class="nomes">João</td>
            <td class="xadrez-letra">13</td>
            <td class="xadrez-fundo">15</td>
            <td class="xadrez-letra">14</td>
            <td class="xadrez-fundo">12</td>
            <td class="media media-especial">14</td>
        </tr>
        <tr>
            <td class="nomes">Ana</td>
            <td class="xadrez-fundo">18</td>
            <td class="xadrez-letra">17</td>
            <td class="xadrez-fundo">19</td>
            <td class="xadrez-letra">18</td>
            <td class="media ">18</td>
        </tr>
        <tr>
            <td class="nomes">Maria</td>
            <td class="xadrez-letra">15</td>
            <td class="xadrez-fundo">20</td>
            <td class="xadrez-letra">18</td>
            <td class="xadrez-fundo">17</td>
            <td class="media">18</td>
        </tr>
        <tr>
            <td class="nomes">Rui</td>
            <td class="xadrez-fundo">11</td>
            <td class="xadrez-letra">13</td>
            <td class="xadrez-fundo">15</td>
            <td class="xadrez-letra">14</td>
            <td class="media media-especial">13</td>
        </tr>
        <tr>
            <td class="nomes">Sofia</td>
            <td class="xadrez-letra">19</td>
            <td class="xadrez-fundo">18</td>
            <td class="xadrez-letra">20</td>
            <td class="xadrez-fundo">19</td>
            <td class="media">19</td>
        </tr>
    </table>
</body>
</html>
