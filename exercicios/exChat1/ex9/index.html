<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipa de Andebol</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        caption {
           font-size: 20px;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 300px;
        }

        td, th {
            border: 1px solid black;
            padding: 5px;
        }

        .num {
            text-align: right;
        }

        #atleta_nova {
            background-color: brown;
            color: cyan;
            font-weight: bold;
        }

        tbody tr:nth-child(even) {
            background-color: lightblue;
            color: blue;
        }
        tbody tr:nth-child(odd) {
            background-color: lightcoral;
            color: rgb(117, 6, 6);
        }

        .media {
            background-color: black;
            color: white;
        }

        tfoot td {
            text-decoration-line: underline;
        }
    </style>
</head>
<body>
    <h1>Equipa de Andebol</h1>
    <table>
        <caption>Dados das Membras da Equipa de Andebol</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Idade</th>
                <th scope="col">Peso</th>
                <th scope="col">Dia</th>
            </tr> 
        </thead>
        <tbody>
            <tr>
                <td>Georgina</td>
                <td class="num">18</td>
                <td class="num">75</td>
                <td class="num">12</td>
            </tr>
            <tr>
                <td>Teresa</td>
                <td class="num">20</td>
                <td class="num">64</td>
                <td class="num">16</td>
            </tr>
            <tr>
                <td>Susana</td>
                <td class="num">19</td>
                <td class="num">68</td>
                <td class="num">14</td>
            </tr>
            <tr>
                <td>Paula</td>
                <td class="num" id="atleta_nova">17</td>
                <td class="num">70</td>
                <td class="num">17</td>
            </tr>
            <tr>
                <td>Rita</td>
                <td class="num">21</td>
                <td class="num">80</td>
                <td class="num">8</td>
            </tr>
            <tr>
                <td>Manuela</td>
                <td class="num">18</td>
                <td class="num">82</td>
                <td class="num">19</td>
            </tr>
            <tr>
                <td>Gisela</td>
                <td class="num">20</td>
                <td class="num">74</td>
                <td class="num">20</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row" class="media">Média de Idade</th>
                <td class="num"><strong>19</strong></td>
            </tr>
            <tr>
                <th scope="row" class="media">Média de Peso</th>
                <td class="num"><strong>72</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
